# ============================================================
# R_N_Database —— Netlify 配置
#
# 部署方式：GitHub 仓库 → Netlify 自动部署（push 即上线）
# ============================================================

[build]
  # 不是 echo 占位：Git 自动部署意味着每次 push 都直接影响线上，
  # 一个语法错误就会把站点打挂。check.mjs 做轻量校验，
  # 校验失败 → Netlify 构建失败 → 线上保持上一个正常版本。
  command = "node scripts/check.mjs"
  publish = "public"

[build.environment]
  # ★ 必须显式钉住：Netlify 默认 Node 版本会变，而
  #   @netlify/blobs v8 需要 Node 18+；中文分词用 Intl.Segmenter
  #   也依赖完整 ICU 的现代 Node。不钉住会出现"本地正常、线上分词全乱"。
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # 不要把 pdfjs-dist 打进 bundle。原因不是体积，而是它会在运行时
  # 动态 import 同目录下的 ./pdf.worker.mjs —— esbuild 只跟踪静态 import，
  # 打包后这个相对路径在 /var/task 里不存在，线上抽 PDF 就报
  #   Setting up fake worker failed: Cannot find module
  #   '/var/task/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs'
  # 列成 external 后，Netlify 会把整个包放进函数的 node_modules，
  # 相对路径就又能解析了。（本地开发天然有 node_modules，所以看不出来。）
  external_node_modules = ["pdfjs-dist"]

# ============================================================
# 安全响应头
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 静态资源带 ?v= 版本号，可长缓存
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 一律回源校验：防止 CDN/浏览器长期缓存旧页面导致改版不生效
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# 注：/api/* 路由由 Functions v2 的 config.path 自行声明，
#     不需要在这里写 redirects（沿用图库项目的做法）。
