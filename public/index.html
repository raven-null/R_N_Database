<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R_N 资料库</title>
  <!-- CSS/JS 带 ?v= 版本号：netlify.toml 对 /css/* /js/* 设了 immutable 长缓存，
       改版时必须同步改这里的 v 值，否则客户端拿不到新文件。 -->
  <link rel="stylesheet" href="/css/style.css?v=0.7.1">
</head>
<body class="list-page">
  <header class="topbar">
    <a class="brand" href="/">R_N <span>资料库</span></a>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="筛选标题 / 标签 / 分类 / 拼音　·　按回车全文检索正文" autocomplete="off">
      <span class="kbd-hint">回车=查正文</span>
    </div>

    <select id="sort" title="排序方式">
      <option value="recent">最近入库</option>
      <option value="oldest">最早入库</option>
      <option value="title">按标题</option>
      <option value="size">按体积</option>
    </select>

    <div class="topbar-actions">
      <button class="btn ghost" id="btn-select" title="多选后可批量加标签、改分类">选择</button>
      <button class="btn ghost" id="btn-upload" title="上传文件到暂存区（文件/文件夹也可以直接拖进来）">上传</button>
      <button class="btn ghost" id="btn-upload-dir" title="上传整个文件夹：保留目录结构，自动跳过系统文件、不支持的类型与超大文件">传文件夹</button>
    </div>

    <div id="auth-area" class="auth-area"></div>
  </header>

  <div id="banner"></div>

  <div class="layout">
    <aside class="sidebar">
      <div id="facets"></div>
    </aside>

    <main class="main">
      <div class="list-head">
        <span id="stats" class="stats">加载中…</span>
      </div>
      <div id="pending" class="pending"></div>
      <div id="results" class="results">
        <div class="empty">正在加载…</div>
      </div>
    </main>
  </div>

  <!-- 批量操作栏：底部浮出，仅在选择模式显示 -->
  <div id="selbar" class="selbar" hidden></div>

  <script type="module" src="/js/list.js?v=0.7.1"></script>
</body>
</html>
