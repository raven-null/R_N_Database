<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档 · R_N 资料库</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#f4efe4">
  <link rel="stylesheet" href="/css/style.css?v=0.8.0">
</head>
<body class="view-page">
  <!-- 阅读页「文档优先」：顶栏只有返回 / 标题 / 详情 / 下载，
       其余信息收进可折叠面板，文档本身占满剩余全部视口高度。
       各类说明一律不落在页面上，收进「?」。 -->
  <header class="view-topbar">
    <a class="icon-btn" href="/index.html" aria-label="返回列表">←</a>
    <h1 id="doc-title">加载中…</h1>
    <button class="tip" type="button" id="tip-page" hidden>?</button>
    <div id="actions" class="actions"></div>
  </header>

  <div id="notice" class="notice-slot"></div>

  <!-- 元信息 / 摘要 / 标签：默认折叠 -->
  <div id="panel" class="panel" hidden>
    <div id="doc-meta" class="doc-meta"></div>
    <div id="doc-summary"></div>
    <div id="doc-tags" class="doc-tags"></div>
    <div id="panel-actions" class="panel-actions"></div>
  </div>

  <div id="editor-slot"></div>

  <div id="frame" class="frame">
    <div class="empty">正在加载预览…</div>
  </div>

  <script type="module" src="/js/view.js?v=0.8.0"></script>
</body>
</html>
